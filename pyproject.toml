[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "conda-recipe-upstream-validator"
version = "0.1.0"
description = "Validate conda recipe dependencies against upstream package metadata (DESCRIPTION, setup.py, etc.)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "BSD-3-Clause"}
dependencies = [
    "pyyaml",
]
authors = [
    { name = "Antonio S. Cofiño (@cofinoa)", email = "cofinoa@gmail.com" }
]
keywords = ["conda", "recipe", "validation", "dependencies", "upstream"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/cofinoa/conda-recipe-upstream-validator"
Documentation = "https://github.com/cofinoa/conda-recipe-upstream-validator#readme"
Repository = "https://github.com/cofinoa/conda-recipe-upstream-validator.git"
Issues = "https://github.com/cofinoa/conda-recipe-upstream-validator/issues"

[project.scripts]
conda-recipe-upstream-validator = "upstream_recipe_validator.cli:main"

[tool.setuptools]
packages = ["upstream_recipe_validator"]

[tool.setuptools.package-data]
upstream_recipe_validator = ["r_packages.yaml"]
